name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Syntax and leak check
        run: bash tools/check.sh
      - name: Schema check
        run: php tools/check_schema.php

      - name: Soft-delete coverage
        run: php tools/check_soft_delete.php

      - name: Form integrity
        run: php tools/check_forms.php
      - name: .env parser tests
        run: php tools/test_env.php

      - name: CSRF tests
        run: php tools/test_csrf.php

      - name: Upload validation tests
        run: php tools/test_upload.php

      - name: Mail template tests
        run: php tools/test_mail_templates.php

      - name: Placeholder/parameter count
        run: php tools/check_placeholders.php

      - name: Invoice item tests
        run: php tools/test_invoice_items.php

      - name: Time billing tests
        run: php tools/test_time_billing.php

      - name: File access tests
        run: php tools/test_file_access.php

      - name: Error page tests
        run: php tools/test_errors.php

      - name: Reminder and recurrence tests
        run: php tools/test_cron_billing.php

      - name: Report tests
        run: php tools/test_reports.php

      - name: Report page renders
        run: php tools/test_reports_render.php

      - name: Receipt tests
        run: php tools/test_receipts.php

      - name: Password reset tests
        run: php tools/test_auth_reset.php
